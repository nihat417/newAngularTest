<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-copy">
      <strong>My Notes</strong>
      <p>Меньше шума. Больше ясных мыслей.</p>
    </div>

    <div class="subscribe">
      <label for="subscriber-name">Как к вам обращаться?</label>
      <div class="subscribe-row">
        <input
          id="subscriber-name"
          type="text"
          [(ngModel)]="username"
          placeholder="Ваше имя"
          autocomplete="name"
        />
        <button type="button" (click)="onSubscribeClick()">Подписаться</button>
      </div>
      @if (username.trim()) {
        <p class="greeting">Рады видеть вас, {{ username }}!</p>
      }
    </div>
  </div>

  <div class="footer-bottom">
    <span>&copy; 2026 My Notes</span>
    <span>Сделано для ваших идей</span>
  </div>
</footer>
