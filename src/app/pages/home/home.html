<section class="page-intro">
  <span class="eyebrow">Личное пространство</span>
  <h1 (dblclick)="handleTitleClick()">Мои заметки</h1>
  <p>Сохраняйте идеи, задачи и важные мысли в одном месте.</p>
</section>

<div class="notes-layout">
  <section class="notes-panel" aria-labelledby="notes-title">
    <div class="section-heading">
      <div>
        <span class="eyebrow">Коллекция</span>
        <h2 id="notes-title">Все заметки</h2>
      </div>
      <span class="notes-count">{{ notes.length }}</span>
    </div>

    <div class="notes-grid">
      @for (note of notes; track note.id) {
        <article class="note-card">
          <div class="note-icon" aria-hidden="true">✦</div>
          <h3>{{ note.title }}</h3>
          <a [routerLink]="['/notedetail', note.id]" class="read-more">Читать далее</a>
        </article>
      } @empty {
        <div class="empty-state">
          <span aria-hidden="true">✎</span>
          <h3>Заметок пока нет</h3>
          <p>Создайте первую заметку с помощью формы справа.</p>
        </div>
      }
    </div>
  </section>

<app-note-add></app-note-add>
</div>
